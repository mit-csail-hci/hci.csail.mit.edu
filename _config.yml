# Site settings
title: MIT HCI
description: Human-Computer Interaction at MIT CSAIL
url: "https://hci.csail.mit.edu"
baseurl: ""

# Build settings
markdown: kramdown
plugins:
  - jekyll-seo-tag

# Social preview image for jekyll-seo-tag
defaults:
  - scope:
      path: ""
    values:
      image: /assets/images/social/group-meeting.jpg

# Exclude files from build
exclude:
  - README.md
  - LICENSE
  - .gitignore
  - Gemfile
  - Gemfile.lock

# Assets
sass:
  sass_dir: _sass
  style: compressed