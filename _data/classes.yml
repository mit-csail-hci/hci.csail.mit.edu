- number: "6.4500"
  title: Design for the Web
  image: designftw.jpg
  url: https://designftw.mit.edu/
  semester: Spring 2026
  instructors: David Karger
  description: >
    This course will teach the principles and technologies for designing usable user interfaces for the Web. You will learn the key principles and methods of user interface design, including learnability, efficiency, safety, prototyping, and user testing. You will learn the core web languages of HTML, CSS, and Javascript, their different roles, and the rationales for the widely varying designs. You will also learn about reactivity through the frontend web framework Vue.js. We will use these languages to create usable web interfaces. We will also touch on the fundamentals of graphic design theory, as design and usability go hand in hand.

- number: "6.1040"
  title: Software Design
  image: software-studio.jpg
  url: https://student.mit.edu/catalog/search.cgi?search=6.1040
  semester: Fall 2025
  instructors: Daniel Jackson, Mitchell Gordon
  description: >
    Provides design-focused instruction on how to build complex software applications. Design topics include classic human-computer interaction (HCI) design tactics (need finding, heuristic evaluation, prototyping, user testing), conceptual design (inventing, modeling and evaluating constituent concepts), social and ethical implications, abstract data modeling, and visual design. Implementation topics include reactive front-ends, web services, and databases. Students work both on individual projects and a larger team project in which they design and build full-stack web applications.

- number: "6.104"
  title: Software Studio
  image: software-studio.jpg
  url: https://stellar.mit.edu/S/course/6/fa16/6.170/index.html
  semester: Fall 2019
  instructors: Daniel Jackson, Arvind Satyanarayan
  description: >
    Covers design and implementation of software systems, using web applications as the platform. Emphasizes the role of
    conceptual design in achieving clarity, simplicity, and modularity. Students complete open-ended individual assignments
    and a major team project. Enrollment may be limited.

- number: "6.451"
  title: Engineering Interactive Technologies
  image: engineering-interactive-technologies.png
  url: https://hcie.csail.mit.edu/classes/2021-fall-6810/6810-engineering-interactive-technologies.html
  semester: Fall 2021
  instructors: Stefanie Mueller
  description: >
    Teaches how to build cutting edge interactive technologies and provides an overview of each field. Topics covered include
    multitouch, augmented reality, haptics, wearables, brain computer interfaces, tangibles, fabrication, and more.


- number: "6.8510"
  title: Intelligent Multimodal User Interfaces
  image: multimodal.png
  url: https://student.mit.edu/catalog/search.cgi?search=6.8510
  semester: Spring 2026
  instructors: Randall Davis
  description: >
    Topics include basic technologies for handling speech, vision, pen-based interaction, and other modalities, as well
    as various techniques for combining modalities. Substantial readings and a term project, where students build an interface.

- number: "6.4550"
  title: Interactive Music Systems
  image: dataviz.png
  url: https://student.mit.edu/catalog/search.cgi?search=6.4550
  semester: Spring 2026
  instructors: Eran Egozy
  description: >
    Explores audio synthesis, musical structure, human-computer interaction, and visual presentation for creating
    interactive musical experiences. Topics include audio synthesis, mixing and looping, MIDI sequencing, generative
    composition, motion sensors, music games, and graphics for UI design and visualization. Weekly programming
    assignments in Python, culminating in a final original interactive music system.

- number: "6.C35 / 6.C85"
  title: Interactive Data Visualization and Society
  image: dataviz.png
  url: http://vis.csail.mit.edu/classes/6.894/
  semester: Spring 2026
  instructors: Arvind Satyanarayan
  description: >
    Design, ethical, and technical skills for creating effective visualizations. Short assignments build competency with
    the data analysis and visualization design process, weekly labs cover coding and technical skills, and a capstone
    project asks students to analyze real-world data from external partners to communicate insights about societal issues.
    Cross-listed as 11.C35[J], CMS.C35[J], and IDS.C35[J]. Limited enrollment.
