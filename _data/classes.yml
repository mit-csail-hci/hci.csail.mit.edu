- number: "6.4500"
  title: Design for the Web — Languages and User Interfaces
  image: designftw.jpg
  url: https://designftw.mit.edu/
  semester: Spring 2026
  instructors: David Karger
  description: >
    Instruction in the principles and technologies for designing usable user interfaces for Web applications. Focuses on the key principles and methods of user interface design, including learnability, efficiency, safety, prototyping, and user testing. Provides instruction in the core web languages of HTML, CSS, and Javascript, their different roles, and the rationales for the widely varying designs. These languages are used to create usable web interfaces and applications. Covers fundamentals of graphic design theory, as design and usability go hand in hand.

- number: "6.104"
  title: Software Studio
  image: software-studio.jpg
  url: https://stellar.mit.edu/S/course/6/fa16/6.170/index.html
  semester: Fall 2019
  instructors: Daniel Jackson, Arvind Satyanarayan
  description: >
    Covers design and implementation of software systems, using web applications as the platform. Emphasizes the role of
    conceptual design in achieving clarity, simplicity, and modularity. Students complete open-ended individual assignments
    and a major team project. Enrollment may be limited.

- number: "6.451"
  title: Engineering Interactive Technologies
  image: engineering-interactive-technologies.png
  url: https://hcie.csail.mit.edu/classes/2021-fall-6810/6810-engineering-interactive-technologies.html
  semester: Fall 2021
  instructors: Stefanie Mueller
  description: >
    Teaches how to build cutting edge interactive technologies and provides an overview of each field. Topics covered include
    multitouch, augmented reality, haptics, wearables, brain computer interfaces, tangibles, fabrication, and more.


- number: "6.8510"
  title: Intelligent Multimodal User Interfaces
  image: multimodal.png
  url: https://student.mit.edu/catalog/search.cgi?search=6.8510
  semester: Spring 2026
  instructors: Randall Davis
  description: >
    Implementation and evaluation of intelligent multi-modal user interfaces, taught from a combination of hands-on
    exercises and papers from the original literature. Covers basic technologies for handling speech, vision,
    pen-based interaction, and other modalities, as well as various techniques for combining modalities. Substantial
    readings and a term project, where students build software demonstrating course concepts.

- number: "6.4550"
  title: Interactive Music Systems
  image: dataviz.png
  url: https://student.mit.edu/catalog/search.cgi?search=6.4550
  semester: Spring 2026
  instructors: Eran Egozy
  description: >
    Explores audio synthesis, musical structure, human computer interaction (HCI), and visual presentation for the
    creation of interactive musical experiences. Topics include audio synthesis; mixing and looping; MIDI sequencing;
    generative composition; motion sensors; music games; and graphics for UI, visualization, and aesthetics. Includes
    weekly programming assignments in python. Teams build an original, dynamic, and engaging interactive music system
    for their final project. Students taking graduate version complete different assignments. Limited to 36.

- number: "6.C35 / 6.C85"
  title: Interactive Data Visualization and Society
  image: dataviz.png
  url: https://vis-society.github.io/
  semester: Spring 2026
  instructors: Arvind Satyanarayan
  description: >
    Covers the design, ethical, and technical skills for creating effective visualizations. Short assignments build
    familiarity with the data analysis and visualization design process. Weekly lab sessions present coding and technical
    skills. A final project provides experience working with real-world big data, provided by external partners, in order
    to expose and communicate insights about societal issues.

- number: "6.1040"
  title: Software Design
  image: software-studio.jpg
  url: https://student.mit.edu/catalog/search.cgi?search=6.1040
  semester: Fall 2025
  instructors: Daniel Jackson, Mitchell Gordon
  description: >
    Provides design-focused instruction on how to build complex software applications. Presents key skills in product design and human-computer interaction (identifying authentic demand, prototyping, visual design, and user testing), software concept design (achieving clarity, modularity, and focus in structuring functionality), and analyzing social and ethical implications. Implementation topics include client/server web apps, reactive front-ends, and databases. Students work on both individual projects and a larger team project, and are taught to make effective and intentional use of LLMs in design and coding.
